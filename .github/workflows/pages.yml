name: Website pruefen und GitHub Pages veroeffentlichen

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'daten/**'
      - 'export_webdaten.py'
      - 'export_wp21.py'
      - 'wp21_scan.py'
      - 'wp21_autopruefung.py'
      - 'wp21_rechtsfolgen.py'
      - 'wp21_betriebsbericht.py'
      - 'wp21_benchmark.py'
      - 'wp21_dip_kontrolle.py'
      - 'wp21_dip_monitor.py'
      - 'wp21_dip_positionen.py'
      - 'wp21_pruefqueue.py'
      - 'wp21_dip_live_probe.py'
      - 'wp21_premerge_dryrun.py'
      - 'wp21_vollstaendigkeit.py'
      - 'wp21_pruefbericht.py'
      - 'wp21_mehrfach_40.py'
      - 'wp21_einspruchsbelege.py'
      - 'wp21_anonyme_quellen.py'
      - 'wp21_fallkontext.py'
      - 'wp21_source_regression.py'
      - 'wp21_rueckbezug.py'
      - 'wp21_quellen_adressaten.py'
      - 'tests/test_wp21_quellen_adressaten.py'
      - 'parser.py'
      - 'tests/**'
      - 'WP21.md'
      - 'QUELLENABGLEICH.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'wp21_autopruefung.py'
      - 'wp21_rechtsfolgen.py'
      - 'wp21_betriebsbericht.py'
      - 'wp21_benchmark.py'
      - 'wp21_dip_kontrolle.py'
      - 'wp21_dip_monitor.py'
      - 'wp21_dip_positionen.py'
      - 'wp21_pruefqueue.py'
      - 'wp21_dip_live_probe.py'
      - 'wp21_premerge_dryrun.py'
      - 'wp21_vollstaendigkeit.py'
      - 'wp21_pruefbericht.py'
      - 'wp21_mehrfach_40.py'
      - 'wp21_einspruchsbelege.py'
      - 'wp21_anonyme_quellen.py'
      - 'wp21_fallkontext.py'
      - 'wp21_source_regression.py'
      - 'wp21_rueckbezug.py'
      - 'wp21_quellen_adressaten.py'
      - 'tests/test_wp21_quellen_adressaten.py'
      - 'parser.py'
      - 'docs/**'
      - 'daten/**'
      - 'export_webdaten.py'
      - 'export_wp21.py'
      - 'wp21_scan.py'
      - 'tests/**'
      - 'WP21.md'
      - 'QUELLENABGLEICH.md'
      - '.github/workflows/pages.yml'
  schedule:
    # Täglich um 06:23 UTC (Sommer-/Winterzeit in Deutschland beachten).
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      vollstaendiger_dip_trockenlauf:
        description: 'Amtlichen DIP-Erstlauf vollstaendig und isoliert testweise ausfuehren'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages-main
  cancel-in-progress: false

jobs:
  pruefen:
    name: 20./21. Wahlperiode pruefen und aktuelle Protokolle scannen
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Python-Abhaengigkeiten installieren
        run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - name: Datenexporte mit Isolationstests validieren
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m pytest -q tests
      - name: Echte DIP-API kurz auf Erreichbarkeit und Schema pruefen
        id: dipprobe
        timeout-minutes: 3
        continue-on-error: true
        env:
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
        run: python wp21_dip_live_probe.py
      - name: Bei DIP-Endpunktproblemen Warnung ausgeben
        if: steps.dipprobe.outcome == 'failure'
        run: echo '::warning::DIP-Endpunkt/Schnittstellenformat nicht bestätigt; automatische Zähler bleiben unverändert.'
      - name: Gesamte bisherige DIP-21.-WP-Historie isoliert vor Merge testweise verarbeiten
        if: github.event_name == 'workflow_dispatch' && inputs.vollstaendiger_dip_trockenlauf == true && steps.dipprobe.outcome == 'success'
        id: dipdryrun
        continue-on-error: true
        timeout-minutes: 25
        env:
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
        run: python wp21_premerge_dryrun.py --output wp21_premerge_dryrun.json
      - name: Ersten kompletten DIP-API-Durchlauf als Prüfprotokoll archivieren
        if: github.event_name == 'workflow_dispatch' && steps.dipdryrun.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-vollstaendiger-dip-trockenlauf-${{ github.run_id }}
          path: wp21_premerge_dryrun.json
          if-no-files-found: error
          retention-days: 30
      - name: Warnung bei fehlgeschlagenem historischem DIP-Trockenlauf
        if: github.event_name == 'workflow_dispatch' && steps.dipdryrun.outcome == 'failure'
        run: echo '::warning::Vollständige DIP-Erstladung noch nicht erfolgreich validiert; keine automatische Zählung.'
      - name: Quellenbasierte Positiv- und Negativkontrollen gegen historische Referenz pruefen
        run: python wp21_benchmark.py --output wp21_regression_audit.json
      - name: Quellenbenchmark mit konkreten Gegenbeispielen archivieren
        uses: actions/upload-artifact@v4
        with:
          name: wp21-quellenbenchmark-${{ github.run_id }}
          path: wp21_regression_audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Unabhaengige DIP-Positivstichprobe mit belegtem Anfangsbestand vergleichen
        run: python wp21_dip_kontrolle.py --report docs/data/dip_kontrolle_21.json
      - name: Website-JavaScript auf Syntaxfehler pruefen
        run: node --check docs/app.js
      - name: Historische und aktuelle Quellenlisten gegen veroeffentlichte JSONs pruefen
        run: |
          python export_webdaten.py --check
          python export_wp21.py --check
      - name: Bereits heruntergeladene 21.-WP-Protokolle wiederverwenden
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: .cache/wp21
          key: wp21-xml-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wp21-xml-
      - name: Letzten erfolgreichen DIP-Metadatenzustand wiederverwenden
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            .cache/dip21/state.json
            .cache/dip21/positionen.json
          key: dip21-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dip21-state-
      - name: Letzten erfolgreichen Website-Quellenstand wiederverwenden
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            docs/data/scan_21.json
            docs/data/hinweise_21.json
            docs/data/autopruefung_21.json
            docs/data/rechtsfolgen_21.json
            docs/data/dip_kontrolle_21.json
            docs/data/dip_live_21.json
            docs/data/dip_positionen_21.json
            docs/data/dip_prueffalle_21.json
            docs/data/vollstaendigkeit_21.json
          key: wp21-feed-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wp21-feed-
      - name: Amtliche DIP-Vorgaenge auf Neuerungen und geaenderte Entscheidungen pruefen
        if: github.event_name != 'pull_request'
        id: diplive
        continue-on-error: true
        env:
          # Optionaler eigener Key; sonst oeffentlich dokumentierter DIP-Key.
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
        run: |
          python wp21_dip_monitor.py \
            --state .cache/dip21/state.json \
            --report docs/data/dip_live_21.json \
            --changes wp21_dip_aenderungen.json
      - name: Vorgangspositionen und nachtraegliche Entscheidungen nach DIP-Vorgang verknuepfen
        if: github.event_name != 'pull_request' && steps.diplive.outcome == 'success'
        id: dippositions
        continue-on-error: true
        env:
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
        run: |
          python wp21_dip_positionen.py \
            --vorgang-state .cache/dip21/state.json \
            --position-state .cache/dip21/positionen.json \
            --report docs/data/dip_positionen_21.json \
            --changes wp21_dip_positionen_aenderungen.json
      - name: Amtliche DIP-Vorgänge mit ihren Verfahrensschritten verknüpfen
        if: github.event_name != 'pull_request' && steps.dippositions.outcome == 'success'
        id: dipqueue
        continue-on-error: true
        run: |
          python wp21_pruefqueue.py \
            --vorgang-state .cache/dip21/state.json \
            --position-state .cache/dip21/positionen.json \
            --report docs/data/dip_prueffalle_21.json \
            --full wp21_dip_verknuepfte_faelle.json
      - name: Vollständige verknüpfte DIP-Prüffälle archivieren
        if: github.event_name != 'pull_request' && steps.dipqueue.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-dip-verknuepfte-prueffalle-${{ github.run_id }}
          path: wp21_dip_verknuepfte_faelle.json
          if-no-files-found: error
          retention-days: 30
      - name: DIP-Vorgangspositionen-Änderungen archivieren
        if: github.event_name != 'pull_request' && steps.dippositions.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-dip-positionen-${{ github.run_id }}
          path: wp21_dip_positionen_aenderungen.json
          if-no-files-found: error
          retention-days: 30
      - name: Geaenderte DIP-Positionen nicht verfuegbar
        if: github.event_name != 'pull_request' && steps.dippositions.outcome == 'failure'
        run: echo '::warning::Positionen-Abgleich fehlgeschlagen; vorheriger erfolgreicher Status bleibt unverändert.'
      - name: Amtliche DIP-Aenderungen archivieren
        if: github.event_name != 'pull_request' && steps.diplive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-dip-aenderungen-${{ github.run_id }}
          path: wp21_dip_aenderungen.json
          if-no-files-found: error
          retention-days: 30
      - name: Voruebergehend fehlgeschlagene DIP-Suche vermerken
        if: github.event_name != 'pull_request' && steps.diplive.outcome == 'failure'
        run: echo '::warning::DIP-API-Daten derzeit nicht aktuell; alter erfolgreicher Bericht bleibt sichtbar, bestaetigte Zahlen unveraendert.'
      - name: Offizielle XML-Protokolle der 21. Wahlperiode auf neue Hinweise pruefen
        if: github.event_name != 'pull_request'
        id: scan
        # Der Scanner liefert lediglich Hinweise. Ein vorübergehender Ausfall
        # der Bundestagsquelle darf einen geprüften Website-Stand nicht sperren.
        continue-on-error: true
        run: |
          python wp21_scan.py \
            --cache-dir .cache/wp21 \
            --candidates wp21_hinweise.csv \
            --summary docs/data/scan_21.json \
            --public-feed docs/data/hinweise_21.json
      - name: WP21/040 Zweierpaare gesondert absichern
        if: github.event_name != 'pull_request' && steps.scan.outcome == 'success'
        id: multiple40
        continue-on-error: true
        run: python wp21_mehrfach_40.py --cache .cache/wp21 --output .audit/wp21_040_pairs.json
      - name: WP21/040 Quellenakten archivieren
        if: github.event_name != 'pull_request' && steps.multiple40.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-040-getrennte-erteilungen-${{ github.run_id }}
          path: .audit/wp21_040_pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Parser-Fundstellen automatisch mit belegten Personen/Sitzungen abgleichen
        if: github.event_name != 'pull_request' && steps.scan.outcome == 'success'
        id: autopruefung
        continue-on-error: true
        run: |
          python wp21_autopruefung.py \
            --cache-dir .cache/wp21 \
            --source-summary docs/data/scan_21.json \
            --verified daten/wirksame_ordnungsrufe_21wp.csv \
            --candidates wp21_autopruefung.csv \
            --report docs/data/autopruefung_21.json
      - name: Einsprueche und moegliche Ruecknahmen als Pruefhinweise sammeln
        if: github.event_name != 'pull_request' && steps.scan.outcome == 'success'
        id: rechtsfolgen
        continue-on-error: true
        run: |
          python wp21_rechtsfolgen.py \
            --cache-dir .cache/wp21 \
            --source-summary docs/data/scan_21.json \
            --candidates wp21_rechtsfolgen_hinweise.csv \
            --report docs/data/rechtsfolgen_21.json
      - name: Ruecknahme- und Einspruchs-Hinweise archivieren
        if: github.event_name != 'pull_request' && steps.rechtsfolgen.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-rechtsfolgen-${{ github.run_id }}
          path: wp21_rechtsfolgen_hinweise.csv
          if-no-files-found: error
          retention-days: 30
      - name: Meldung bei fehlgeschlagener Rechtsfolgenpruefung
        if: github.event_name != 'pull_request' && steps.rechtsfolgen.outcome == 'failure'
        run: echo '::warning::Rechtsfolgen-Signalprüfung fehlgeschlagen; keine automatische Ruecknahme.'
      - name: Amtliche DIP-Positivkontrollen mit aktuellen Parser-Hinweisen abgleichen
        if: github.event_name != 'pull_request' && steps.autopruefung.outcome == 'success'
        id: dipcontrol
        continue-on-error: true
        run: |
          python wp21_dip_kontrolle.py \
            --proposals wp21_autopruefung.csv \
            --candidates wp21_dip_pruefliste.csv \
            --report docs/data/dip_kontrolle_21.json
      - name: Vergleichsliste aus amtlicher DIP-Positivstichprobe archivieren
        if: github.event_name != 'pull_request' && steps.dipcontrol.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-dip-referenzvergleich-${{ github.run_id }}
          path: wp21_dip_pruefliste.csv
          if-no-files-found: error
          retention-days: 30
      - name: Meldung bei fehlgeschlagener Vorpruefung
        if: github.event_name != 'pull_request' && steps.autopruefung.outcome == 'failure'
        run: echo '::warning::Automatischer Personenabgleich fehlgeschlagen; bestätigte Zahlen bleiben unverändert.'
      - name: Automatischen Personenabgleich zur Prüfung archivieren
        if: github.event_name != 'pull_request' && steps.autopruefung.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-autopruefung-${{ github.run_id }}
          path: wp21_autopruefung.csv
          if-no-files-found: error
          retention-days: 30
      - name: Hinweis bei fehlgeschlagenem Datenabruf
        if: github.event_name != 'pull_request' && steps.scan.outcome == 'failure'
        run: echo '::warning::21.-WP-Quellenscan derzeit fehlgeschlagen; geprüfte Zähler bleiben unverändert.'
      - name: Pruefhinweise fuer manuelle Auswertung archivieren
        if: github.event_name != 'pull_request' && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-hinweise-${{ github.run_id }}
          path: wp21_hinweise.csv
          if-no-files-found: error
          retention-days: 30
      - name: XML-, Personen- und DIP-Positivbelege auf Vollständigkeitslücken prüfen
        if: github.event_name != 'pull_request' && steps.scan.outcome == 'success' && steps.autopruefung.outcome == 'success'
        id: completeness
        continue-on-error: true
        run: |
          python wp21_vollstaendigkeit.py \
            --scan-summary docs/data/scan_21.json \
            --parser-report docs/data/autopruefung_21.json \
            --xml-candidates wp21_hinweise.csv \
            --parser-candidates wp21_autopruefung.csv \
            --full wp21_vollstaendigkeit_faelle.csv \
            --report docs/data/vollstaendigkeit_21.json
      - name: Vollständige Quellen-Lückenliste als Prüfartefakt archivieren
        if: github.event_name != 'pull_request' && steps.completeness.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-vollstaendigkeit-${{ github.run_id }}
          path: wp21_vollstaendigkeit_faelle.csv
          if-no-files-found: error
          retention-days: 30
      - name: Fachliche Quellen-Prüfakte für hoch priorisierte Fälle erzeugen
        if: github.event_name != 'pull_request' && steps.completeness.outcome == 'success'
        id: highpriority
        continue-on-error: true
        run: |
          python wp21_pruefbericht.py \
            --cases wp21_vollstaendigkeit_faelle.csv \
            --report docs/data/vollstaendigkeit_21.json \
            --output wp21_hochprioritaet_bericht.md
      - name: Hochpriorisierte Quellen-Prüfakte als Artefakt archivieren
        if: github.event_name != 'pull_request' && steps.highpriority.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-hochprioritaet-${{ github.run_id }}
          path: wp21_hochprioritaet_bericht.md
          if-no-files-found: error
          retention-days: 30
      - name: Amtliche XML-Kontexte für nicht erkannte DIP-Positivfälle zusammenstellen
        if: github.event_name != 'pull_request' && steps.completeness.outcome == 'success'
        id: context
        continue-on-error: true
        run: |
          python wp21_fallkontext.py \
            --cache .cache/wp21 \
            --audit-cases wp21_vollstaendigkeit_faelle.csv \
            --output wp21_dip_xml_fallkontext.json
      - name: Vollständige Kontextbelege für die fachliche Nachprüfung archivieren
        if: github.event_name != 'pull_request' && steps.context.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-dip-xml-kontext-${{ github.run_id }}
          path: wp21_dip_xml_fallkontext.json
          if-no-files-found: error
          retention-days: 30
      - name: Quellenabgleich nicht erfolgreich
        if: github.event_name != 'pull_request' && steps.completeness.outcome == 'failure'
        run: echo '::warning::Quellenübergreifendes Vollständigkeits-Audit fehlgeschlagen; bestehende Berichte und bestätigte Zahlen bleiben unverändert.'
      - name: Taeglichen Betrieb und Quellenalter im Actions-Bericht zusammenfassen
        if: github.event_name != 'pull_request'
        env:
          WP21_SCAN_OUTCOME: ${{ steps.scan.outcome }}
          WP21_AUTOPRUEFUNG_OUTCOME: ${{ steps.autopruefung.outcome }}
          WP21_RECHTSFOLGEN_OUTCOME: ${{ steps.rechtsfolgen.outcome }}
          WP21_DIP_OUTCOME: ${{ steps.diplive.outcome }}
          WP21_DIPPOSITIONS_OUTCOME: ${{ steps.dippositions.outcome }}
          WP21_DIPQUEUE_OUTCOME: ${{ steps.dipqueue.outcome }}
        run: python wp21_betriebsbericht.py --data docs/data
      - name: Verwendeten Website-Stand archivieren
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-datenstand-${{ github.run_id }}
          path: |
            docs/data/ordnungsrufe.json
            docs/data/ordnungsrufe_21.json
            docs/data/scan_21.json
            docs/data/hinweise_21.json
            docs/data/autopruefung_21.json
            docs/data/rechtsfolgen_21.json
            docs/data/dip_kontrolle_21.json
            docs/data/dip_live_21.json
            docs/data/dip_positionen_21.json
            docs/data/dip_prueffalle_21.json
            docs/data/vollstaendigkeit_21.json
          if-no-files-found: error
          retention-days: 30
      - name: Website-Artefakt zur Veroeffentlichung uebertragen
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-fuer-pages
          path: docs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  quellenwache:
    name: DIP- und XML-Quellenzustand ueberwachen
    # Watch failures of the validation job itself instead of skipping alerts.
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: dataartifact
        if: needs.pruefen.result == 'success'
        continue-on-error: true
        with:
          name: docs-fuer-pages
          path: docs
      - name: Quellenstand strukturiert pruefen
        id: health
        if: needs.pruefen.result == 'success' && steps.dataartifact.outcome == 'success'
        continue-on-error: true
        run: python wp21_betriebsbericht.py --data docs/data --json-output wp21_health.json
      - name: Bei längerem Quellenausfall einmaligen GitHub-Vorgang öffnen oder schließen
        if: needs.pruefen.result == 'success' && steps.health.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('wp21_health.json','utf8'));
            if (audit.schema !== 'wp21-health-v1' || !audit.sources) {
              throw new Error('Ungültige Quellenüberwachung');
            }
            const marker = '<!-- ordnungsruf-wp21-data-sources -->';
            const bad = Object.entries(audit.sources)
              .filter(([name,data]) => data.state !== 'fresh')
              .map(([name,data]) => '- ' + name + ': ' + data.state +
                   ' (letzter Stand ' + (data.date || 'unbekannt') + ')');
            const {owner,repo} = context.repo;
            const existingIssues = await github.paginate(github.rest.issues.listForRepo,{
              owner,repo,state:'open',per_page:100
            });
            const existing = existingIssues.find(x=>!x.pull_request &&
              (x.body || '').includes(marker));
            if (bad.length === 0) {
              if (existing) {
                await github.rest.issues.update({owner,repo,issue_number:existing.number,
                  state:'closed', state_reason:'completed'});
              }
              core.info('Alle Quellen sind aktuell.');
              return;
            }
            const body = marker + '\nAutomatisch erkannte fehlende oder veraltete Quellenberichte:' +
              '\n\n' + bad.join('\n') +
              '\n\nDies ist keine Aussage über Ordnungsrufe. Der letzte erfolgreiche ' +
              'Datenstand bleibt verfügbar; geprüfte Zähler werden nicht geändert.' +
              '\n\nDetails: https://github.com/' + owner + '/' + repo + '/actions';
            if (existing) {
              if ((existing.body || '') !== body) {
                await github.rest.issues.update({owner,repo,
                  issue_number:existing.number,body});
              }
            } else {
              await github.rest.issues.create({owner,repo,
                title:'Automatischer Quellencheck: Datenstand prüfen',body});
            }
      - name: Fehler des Tageslaufs auch ohne Datenbericht melden
        if: ${{ always() && (needs.pruefen.result != 'success' || steps.dataartifact.outcome == 'failure' || steps.health.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ordnungsruf-wp21-data-sources -->';
            const {owner,repo} = context.repo;
            const link = 'https://github.com/' + owner + '/' + repo +
              '/actions/runs/' + context.runId;
            const body = marker +
              '\nDie automatische Quellen- und Website-Prüfung konnte nicht ' +
              'vollständig abgeschlossen werden. Ursache kann ein fehlgeschlagener ' +
              'Prüftest, ein Workflow-Fehler oder ein fehlendes Datenartefakt sein.' +
              '\n\nBetroffener Lauf: ' + link +
              '\n\nBestätigte Ordnungsruf-Zähler wurden dadurch nicht verändert. ' +
              'Bei erfolgreicher Wiederherstellung aller Quellen wird dieses ' +
              'Störungs-Issue automatisch geschlossen.';
            const issues = await github.paginate(github.rest.issues.listForRepo,{
              owner,repo,state:'open',per_page:100
            });
            const existing = issues.find(x=>!x.pull_request &&
              (x.body || '').includes(marker));
            if (existing) {
              if ((existing.body || '') !== body) {
                await github.rest.issues.update({owner,repo,
                  issue_number:existing.number,body});
              }
            } else {
              await github.rest.issues.create({owner,repo,
                title:'Automatischer Quellencheck: Datenstand prüfen',body});
            }

  veroeffentlichen:
    name: Statische Website bereitstellen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-fuer-pages
          path: docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
