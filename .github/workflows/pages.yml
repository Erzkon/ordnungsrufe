name: Website pruefen und GitHub Pages veroeffentlichen

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'daten/**'
      - 'export_webdaten.py'
      - 'export_wp21.py'
      - 'wp21_scan.py'
      - 'wp21_autopruefung.py'
      - 'wp21_rechtsfolgen.py'
      - 'tests/**'
      - 'WP21.md'
      - 'QUELLENABGLEICH.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'wp21_autopruefung.py'
      - 'wp21_rechtsfolgen.py'
      - 'docs/**'
      - 'daten/**'
      - 'export_webdaten.py'
      - 'export_wp21.py'
      - 'wp21_scan.py'
      - 'tests/**'
      - 'WP21.md'
      - 'QUELLENABGLEICH.md'
      - '.github/workflows/pages.yml'
  schedule:
    # Täglich um 06:23 UTC (Sommer-/Winterzeit in Deutschland beachten).
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-main
  cancel-in-progress: false

jobs:
  pruefen:
    name: 20./21. Wahlperiode pruefen und aktuelle Protokolle scannen
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Python-Abhaengigkeiten installieren
        run: python -m pip install -r requirements.txt
      - name: Datenexporte mit Isolationstests validieren
        run: |
          python -m unittest discover -s tests -p 'test_web_export.py' -v
          python -m unittest discover -s tests -p 'test_wp21.py' -v
          python -m unittest discover -s tests -p 'test_wp21_feed.py' -v
          python -m unittest discover -s tests -p 'test_wp21_autopruefung.py' -v
          python -m unittest discover -s tests -p 'test_wp21_rechtsfolgen.py' -v
          python -m unittest discover -s tests -p 'test_wp21_refresh.py' -v
      - name: Historische und aktuelle Quellenlisten gegen veroeffentlichte JSONs pruefen
        run: |
          python export_webdaten.py --check
          python export_wp21.py --check
      - name: Bereits heruntergeladene 21.-WP-Protokolle wiederverwenden
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: .cache/wp21
          key: wp21-xml-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wp21-xml-
      - name: Letzten erfolgreichen Website-Quellenstand wiederverwenden
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            docs/data/scan_21.json
            docs/data/hinweise_21.json
            docs/data/autopruefung_21.json
            docs/data/rechtsfolgen_21.json
          key: wp21-feed-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wp21-feed-
      - name: Offizielle XML-Protokolle der 21. Wahlperiode auf neue Hinweise pruefen
        if: github.event_name != 'pull_request'
        id: scan
        # Der Scanner liefert lediglich Hinweise. Ein vorübergehender Ausfall
        # der Bundestagsquelle darf einen geprüften Website-Stand nicht sperren.
        continue-on-error: true
        run: |
          python wp21_scan.py \
            --cache-dir .cache/wp21 \
            --candidates wp21_hinweise.csv \
            --summary docs/data/scan_21.json \
            --public-feed docs/data/hinweise_21.json
      - name: Parser-Fundstellen automatisch mit belegten Personen/Sitzungen abgleichen
        if: github.event_name != 'pull_request' && steps.scan.outcome == 'success'
        id: autopruefung
        continue-on-error: true
        run: |
          python wp21_autopruefung.py \
            --cache-dir .cache/wp21 \
            --source-summary docs/data/scan_21.json \
            --verified daten/wirksame_ordnungsrufe_21wp.csv \
            --candidates wp21_autopruefung.csv \
            --report docs/data/autopruefung_21.json
      - name: Einsprueche und moegliche Ruecknahmen als Pruefhinweise sammeln
        if: github.event_name != 'pull_request' && steps.scan.outcome == 'success'
        id: rechtsfolgen
        continue-on-error: true
        run: |
          python wp21_rechtsfolgen.py \
            --cache-dir .cache/wp21 \
            --source-summary docs/data/scan_21.json \
            --candidates wp21_rechtsfolgen_hinweise.csv \
            --report docs/data/rechtsfolgen_21.json
      - name: Ruecknahme- und Einspruchs-Hinweise archivieren
        if: github.event_name != 'pull_request' && steps.rechtsfolgen.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-rechtsfolgen-${{ github.run_id }}
          path: wp21_rechtsfolgen_hinweise.csv
          if-no-files-found: error
          retention-days: 30
      - name: Meldung bei fehlgeschlagener Rechtsfolgenpruefung
        if: github.event_name != 'pull_request' && steps.rechtsfolgen.outcome == 'failure'
        run: echo '::warning::Rechtsfolgen-Signalprüfung fehlgeschlagen; keine automatische Ruecknahme.'
      - name: Meldung bei fehlgeschlagener Vorpruefung
        if: github.event_name != 'pull_request' && steps.autopruefung.outcome == 'failure'
        run: echo '::warning::Automatischer Personenabgleich fehlgeschlagen; bestätigte Zahlen bleiben unverändert.'
      - name: Automatischen Personenabgleich zur Prüfung archivieren
        if: github.event_name != 'pull_request' && steps.autopruefung.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-autopruefung-${{ github.run_id }}
          path: wp21_autopruefung.csv
          if-no-files-found: error
          retention-days: 30
      - name: Hinweis bei fehlgeschlagenem Datenabruf
        if: github.event_name != 'pull_request' && steps.scan.outcome == 'failure'
        run: echo '::warning::21.-WP-Quellenscan derzeit fehlgeschlagen; geprüfte Zähler bleiben unverändert.'
      - name: Pruefhinweise fuer manuelle Auswertung archivieren
        if: github.event_name != 'pull_request' && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-hinweise-${{ github.run_id }}
          path: wp21_hinweise.csv
          if-no-files-found: error
          retention-days: 30
      - name: Verwendeten Website-Stand archivieren
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: wp21-datenstand-${{ github.run_id }}
          path: |
            docs/data/ordnungsrufe.json
            docs/data/ordnungsrufe_21.json
            docs/data/scan_21.json
            docs/data/hinweise_21.json
            docs/data/autopruefung_21.json
            docs/data/rechtsfolgen_21.json
          if-no-files-found: error
          retention-days: 30
      - name: Website-Artefakt zur Veroeffentlichung uebertragen
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-fuer-pages
          path: docs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  veroeffentlichen:
    name: Statische Website bereitstellen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-fuer-pages
          path: docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
