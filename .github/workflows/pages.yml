name: Website pruefen und GitHub Pages veroeffentlichen

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'daten/**'
      - 'export_webdaten.py'
      - 'export_wp21.py'
      - 'wp21_scan.py'
      - 'wp21_autopruefung.py'
      - 'wp21_rechtsfolgen.py'
      - 'wp21_betriebsbericht.py'
      - 'wp21_benchmark.py'
      - 'wp21_dip_kontrolle.py'
      - 'wp21_dip_monitor.py'
      - 'wp21_dip_positionen.py'
      - 'wp21_pruefqueue.py'
      - 'wp21_dip_live_probe.py'
      - 'wp21_premerge_dryrun.py'
      - 'v1_release_gate.py'
      - 'wp21_vollstaendigkeit.py'
      - 'wp21_pruefbericht.py'
      - 'wp21_mehrfach_40.py'
      - 'wp21_episoden.py'
      - 'wp21_episoden_akte.py'
      - 'wp21_amtliche_empfaenger.py'
      - 'wp21_offizielle_empfaenger_akte.py'
      - 'wp21_einspruchsbelege.py'
      - 'wp21_weitere_einspruchsberichte.py'
      - 'wp21_2025_dip_einzelakten.py'
      - 'wp21_2025_massnahmen_lifecycle.py'
      - 'wp21_2025_sieben_originalzeilen.py'
      - 'wp21_40_mehrfach_akte.py'
      - 'wp21_janich_erste_quellenkritik.py'
      - 'wp21_40_empfaenger_belege.py'
      - 'wp21_gottschalk_folgebeobachter.py'
      - 'wp21_gottschalk_plenar_folgen.py'
      - 'wp21_gottschalk_amtliche_beschluesse.py'
      - 'wp21_gottschalk_bounded_review.py'
      - 'wp21_anonyme_quellen.py'
      - 'wp21_vier_quellenbelege.py'
      - 'wp21_hochprioritaet_18.py'
      - 'wp21_18_dip_verfahrenspositionen.py'
      - 'wp21_fallkontext.py'
      - 'wp21_source_regression.py'
      - 'wp21_rueckbezug.py'
      - 'wp21_quellen_adressaten.py'
      - 'tests/test_wp21_quellen_adressaten.py'
      - 'parser.py'
      - 'tests/**'
      - 'WP21.md'
      - 'QUELLENABGLEICH.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'wp21_autopruefung.py'
      - 'wp21_rechtsfolgen.py'
      - 'wp21_betriebsbericht.py'
      - 'wp21_benchmark.py'
      - 'wp21_dip_kontrolle.py'
      - 'wp21_dip_monitor.py'
      - 'wp21_dip_positionen.py'
      - 'wp21_pruefqueue.py'
      - 'wp21_dip_live_probe.py'
      - 'wp21_premerge_dryrun.py'
      - 'v1_release_gate.py'
      - 'wp21_vollstaendigkeit.py'
      - 'wp21_pruefbericht.py'
      - 'wp21_mehrfach_40.py'
      - 'wp21_episoden.py'
      - 'wp21_episoden_akte.py'
      - 'wp21_amtliche_empfaenger.py'
      - 'wp21_offizielle_empfaenger_akte.py'
      - 'wp21_einspruchsbelege.py'
      - 'wp21_weitere_einspruchsberichte.py'
      - 'wp21_2025_dip_einzelakten.py'
      - 'wp21_2025_massnahmen_lifecycle.py'
      - 'wp21_2025_sieben_originalzeilen.py'
      - 'wp21_40_mehrfach_akte.py'
      - 'wp21_janich_erste_quellenkritik.py'
      - 'wp21_40_empfaenger_belege.py'
      - 'wp21_gottschalk_folgebeobachter.py'
      - 'wp21_gottschalk_plenar_folgen.py'
      - 'wp21_gottschalk_amtliche_beschluesse.py'
      - 'wp21_gottschalk_bounded_review.py'
      - 'wp21_anonyme_quellen.py'
      - 'wp21_vier_quellenbelege.py'
      - 'wp21_hochprioritaet_18.py'
      - 'wp21_18_dip_verfahrenspositionen.py'
      - 'wp21_fallkontext.py'
      - 'wp21_source_regression.py'
      - 'wp21_rueckbezug.py'
      - 'wp21_quellen_adressaten.py'
      - 'tests/test_wp21_quellen_adressaten.py'
      - 'parser.py'
      - 'docs/**'
      - 'daten/**'
      - 'export_webdaten.py'
      - 'export_wp21.py'
      - 'wp21_scan.py'
      - 'tests/**'
      - 'WP21.md'
      - 'QUELLENABGLEICH.md'
      - '.github/workflows/pages.yml'
  schedule:
    # Täglich um 06:23 UTC (Sommer-/Winterzeit in Deutschland beachten).
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      vollstaendiger_dip_trockenlauf:
        description: 'Amtlichen DIP-Erstlauf vollstaendig und isoliert testweise ausfuehren'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages-main
  cancel-in-progress: false

jobs:
  pruefen:
    name: 20./21. Wahlperiode pruefen und aktuelle Protokolle scannen
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: PR-Schutz gegen Änderungen bestätigter Zähler gegenüber main
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/main
          for path in daten/wirksame_ordnungsrufe_20wp.csv \
                      daten/wirksame_ordnungsrufe_21wp.csv \
                      docs/data/ordnungsrufe.json \
                      docs/data/ordnungsrufe_21.json; do
            if ! git show "FETCH_HEAD:$path" | cmp -s - "$path"; then
              echo "::error file=$path::Bestätigte Zähler dürfen im PR nicht von main abweichen."
              exit 1
            fi
          done
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Python-Abhaengigkeiten installieren
        run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - name: Datenexporte mit Isolationstests validieren
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m pytest -q tests
      - name: Version 1.0 – echte Browserdaten und Ablehnungsfälle prüfen
        run: |
          node --check docs/verified_contract.js
          node --test tests/frontend_contract.test.cjs
          node --check docs/source_health.js
          node --test tests/source_health.test.cjs
      - name: Version 1.0 – begrenzten Veröffentlichungskandidaten mit geprüften CSVs absichern
        run: |
          python v1_release_gate.py \
            --output .audit/v1_release.json \
            --brief .audit/v1_release.md
      - name: Version-1.0-Freigabeakte archivieren (keine Merge-Freigabe)
        uses: actions/upload-artifact@v6
        with:
          name: ordnungsruf-v1-readiness-${{ github.run_id }}
          path: |
            .audit/v1_release.json
            .audit/v1_release.md
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Echte DIP-API kurz auf Erreichbarkeit und Schema pruefen
        id: dipprobe
        timeout-minutes: 3
        continue-on-error: true
        env:
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
        run: python wp21_dip_live_probe.py
      - name: Bei DIP-Endpunktproblemen Warnung ausgeben
        if: steps.dipprobe.outcome == 'failure'
        run: echo '::warning::DIP-Endpunkt/Schnittstellenformat nicht bestätigt; automatische Zähler bleiben unverändert.'
      - name: Gesamte bisherige DIP-21.-WP-Historie isoliert vor Merge testweise verarbeiten
        if: github.event_name == 'workflow_dispatch' && inputs.vollstaendiger_dip_trockenlauf == true && steps.dipprobe.outcome == 'success'
        id: dipdryrun
        continue-on-error: true
        timeout-minutes: 25
        env:
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
        run: python wp21_premerge_dryrun.py --output wp21_premerge_dryrun.json
      - name: Ersten kompletten DIP-API-Durchlauf als Prüfprotokoll archivieren
        if: github.event_name == 'workflow_dispatch' && steps.dipdryrun.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: wp21-vollstaendiger-dip-trockenlauf-${{ github.run_id }}
          path: wp21_premerge_dryrun.json
          if-no-files-found: error
          retention-days: 30
      - name: Warnung bei fehlgeschlagenem historischem DIP-Trockenlauf
        if: github.event_name == 'workflow_dispatch' && steps.dipdryrun.outcome == 'failure'
        run: echo '::warning::Vollständige DIP-Erstladung noch nicht erfolgreich validiert; keine automatische Zählung.'
      - name: Quellenbasierte Positiv- und Negativkontrollen gegen historische Referenz pruefen
        run: python wp21_benchmark.py --output wp21_regression_audit.json
      - name: Quellenbenchmark mit konkreten Gegenbeispielen archivieren
        uses: actions/upload-artifact@v6
        with:
          name: wp21-quellenbenchmark-${{ github.run_id }}
          path: wp21_regression_audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Unabhaengige DIP-Positivstichprobe mit belegtem Anfangsbestand vergleichen
        run: python wp21_dip_kontrolle.py --report docs/data/dip_kontrolle_21.json
      - name: Website-JavaScript auf Syntaxfehler pruefen
        run: node --check docs/app.js
      - name: Historische und aktuelle Quellenlisten gegen veroeffentlichte JSONs pruefen
        run: |
          python export_webdaten.py --check
          python export_wp21.py --check
      - name: Bereits heruntergeladene 21.-WP-Protokolle wiederverwenden
        if: github.event_name != 'pull_request'
        uses: actions/cache@v5
        with:
          path: .cache/wp21
          key: wp21-xml-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wp21-xml-
      - name: Letzten erfolgreichen DIP-Metadatenzustand wiederverwenden
        if: github.event_name != 'pull_request'
        uses: actions/cache@v5
        with:
          path: |
            .cache/dip21/state.json
            .cache/dip21/positionen.json
          key: dip21-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dip21-state-
      - name: Letzten erfolgreichen Website-Quellenstand wiederverwenden
        if: github.event_name != 'pull_request'
        uses: actions/cache@v5
        with:
          path: |
            docs/data/scan_21.json
            docs/data/hinweise_21.json
            docs/data/autopruefung_21.json
            docs/data/rechtsfolgen_21.json
            docs/data/dip_kontrolle_21.json
            docs/data/dip_live_21.json
            docs/data/dip_positionen_21.json
            docs/data/dip_prueffalle_21.json
            docs/data/vollstaendigkeit_21.json
          key: wp21-feed-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wp21-feed-
      - name: Amtliche DIP-Vorgaenge auf Neuerungen und geaenderte Entscheidungen pruefen
        if: github.event_name != 'pull_request'
        id: diplive
        continue-on-error: true
        env:
          # Optionaler eigener Key; sonst oeffentlich dokumentierter DIP-Key.
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
        run: |
          python wp21_dip_monitor.py \
            --state .cache/dip21/state.json \
            --report docs/data/dip_live_21.json \
            --changes wp21_dip_aenderungen.json
      - name: Vorgangspositionen und nachtraegliche Entscheidungen nach DIP-Vorgang verknuepfen
        if: github.event_name != 'pull_request' && steps.diplive.outcome == 'success'
        id: dippositions
        continue-on-error: true
        env:
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
        run: |
          python wp21_dip_positionen.py \
            --vorgang-state .cache/dip21/state.json \
            --position-state .cache/dip21/positionen.json \
            --report docs/data/dip_positionen_21.json \
            --changes wp21_dip_positionen_aenderungen.json
      - name: Amtliche DIP-Vorgänge mit ihren Verfahrensschritten verknüpfen
        if: github.event_name != 'pull_request' && steps.dippositions.outcome == 'success'
        id: dipqueue
        continue-on-error: true
        run: |
          python wp21_pruefqueue.py \
            --vorgang-state .cache/dip21/state.json \
            --position-state .cache/dip21/positionen.json \
            --report docs/data/dip_prueffalle_21.json \
            --full wp21_dip_verknuepfte_faelle.json
      - name: Vollständige verknüpfte DIP-Prüffälle archivieren
        if: github.event_name != 'pull_request' && steps.dipqueue.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: wp21-dip-verknuepfte-prueffalle-${{ github.run_id }}
          path: wp21_dip_verknuepfte_faelle.json
          if-no-files-found: error
          retention-days: 30
      - name: Zusätzliche amtliche Einspruchsentscheidungen und ein getrenntes Ordnungsgeld prüfen
        if: github.event_name != 'pull_request'
        id: additionalAppeals
        continue-on-error: true
        run: |
          python wp21_weitere_einspruchsberichte.py \
            --ledger daten/wirksame_ordnungsrufe_21wp.csv \
            --output .audit/wp21_weitere_einsprueche.json \
            --brief .audit/wp21_weitere_einsprueche.md
      - name: Weitere Einspruchsentscheidungen ausschließlich als Prüfdaten archivieren
        if: github.event_name != 'pull_request' && steps.additionalAppeals.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: wp21-weitere-einspruchsberichte-${{ github.run_id }}
          path: |
            .audit/wp21_weitere_einsprueche.json
            .audit/wp21_weitere_einsprueche.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Fehlerhafte zusätzliche Einspruchsquellen ausschließlich warnen
        if: github.event_name != 'pull_request' && steps.additionalAppeals.outcome == 'failure'
        run: echo '::warning::Zusätzliche amtliche Einspruchsquellen unvollständig oder ungültig; keine automatische Zählerkorrektur.'
      - name: Mögliche neue Gottschalk-Verfahren nach ursprünglicher Zweiterteilung separat überwachen
        if: github.event_name != 'pull_request' && steps.dippositions.outcome == 'success'
        id: gottschalkWatch
        continue-on-error: true
        run: |
          python wp21_gottschalk_folgebeobachter.py \
            --vorgang-state .cache/dip21/state.json \
            --position-state .cache/dip21/positionen.json \
            --output .audit/wp21_gottschalk_weitere_verfahren.json \
            --brief .audit/wp21_gottschalk_weitere_verfahren.md
      - name: Nur lesenden Gottschalk-Folgebeobachter als separate Prüfakte archivieren
        if: github.event_name != 'pull_request' && steps.gottschalkWatch.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: wp21-gottschalk-folgebeobachter-${{ github.run_id }}
          path: |
            .audit/wp21_gottschalk_weitere_verfahren.json
            .audit/wp21_gottschalk_weitere_verfahren.md
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Wenn Gottschalks amtlicher Verfahrensabgleich fehlschlägt, warnen
        if: github.event_name != 'pull_request' && steps.gottschalkWatch.outcome == 'failure'
        run: echo '::warning::Gottschalk-Originalvorgang oder spätere amtliche Position unvollständig; rechtliche Quellenprüfung erforderlich, kein Zählerupdate.'
      - name: Unabhängig von Vorgangstiteln neue Gottschalk-DIP-Positionen im 14-Tage-Fenster sichten
        if: github.event_name != 'pull_request' && steps.dippositions.outcome == 'success'
        id: gottschalkPositionWide
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          START=$(date -u -d '13 days ago' +%F)
          END=$(date -u +%F)
          python wp21_gottschalk_unkategorisierte_positionen.py \
            --start "$START" --end "$END" \
            --output .audit/gottschalk_current_positions.json \
            --brief .audit/gottschalk_current_positions.md
      - name: Titelunabhängige aktuelle Gottschalk-DIP-Hinweise archivieren
        if: github.event_name != 'pull_request' && steps.gottschalkPositionWide.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: wp21-gottschalk-positions-current-${{ github.run_id }}
          path: |
            .audit/gottschalk_current_positions.json
            .audit/gottschalk_current_positions.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Bei unvollständiger titelunabhängiger Positionsquelle nur warnen
        if: github.event_name != 'pull_request' && steps.gottschalkPositionWide.outcome == 'failure'
        run: echo '::warning::Titelfreie DIP-Positionsquelle im aktuellen 14-Tage-Fenster unvollständig; keine Zähleränderung, keine Negativaussage.'
      - name: Gottschalk-Einsprüche zusätzlich im echten Plenar-XML-Cache prüfen
        if: github.event_name != 'pull_request' && steps.scan.outcome == 'success'
        id: gottschalkPlenary
        continue-on-error: true
        run: |
          LAST=$(python -c 'import json;print(json.load(open("docs/data/scan_21.json"))["letzte_sitzung"])')
          python wp21_gottschalk_plenar_folgen.py \
            --cache .cache/wp21 --cache-only --max-session 150 \
            --last-session "$LAST" \
            --output .audit/wp21_gottschalk_plenary.json \
            --brief .audit/wp21_gottschalk_plenary.md
      - name: Nur lesende Gottschalk-Plenarakte archivieren
        if: github.event_name != 'pull_request' && steps.gottschalkPlenary.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: wp21-gottschalk-plenar-followup-${{ github.run_id }}
          path: |
            .audit/wp21_gottschalk_plenary.json
            .audit/wp21_gottschalk_plenary.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Bei unvollständigen Folge-Plenarprotokollen nur warnen
        if: github.event_name != 'pull_request' && steps.gottschalkPlenary.outcome == 'failure'
        run: echo '::warning::Gottschalk-Folgeprotokolle nicht vollständig; keine automatische Einspruchsentscheidung oder Zähleränderung.'
      - name: Amtliche Gottschalk-Beschlussprotokolle plus vorläufige Sitzung 21/103 nur lesen
        if: github.event_name != 'pull_request' && steps.scan.outcome == 'success'
        id: gottschalkOfficialMinutes
        continue-on-error: true
        run: |
          python wp21_gottschalk_amtliche_beschluesse.py \
            --output .audit/gottschalk_amtliche_protokolle.json \
            --brief .audit/gottschalk_amtliche_protokolle.md
      - name: Amtliche unabhängige PDF-Stichprobe separat archivieren
        if: github.event_name != 'pull_request' && steps.gottschalkOfficialMinutes.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: wp21-gottschalk-amtliche-protokolle-${{ github.run_id }}
          path: |
            .audit/gottschalk_amtliche_protokolle.json
            .audit/gottschalk_amtliche_protokolle.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Amtliche Beschlussprotokoll-Ausfälle ausschließlich warnen
        if: github.event_name != 'pull_request' && steps.gottschalkOfficialMinutes.outcome == 'failure'
        run: echo '::warning::Amtliche Beschlussprotokoll-Stichprobe oder vorläufige 21/103 nicht verfügbar; keine Zähleränderung.'
      - name: Zehn 2025-Originalvorgänge und differenzierte Einsprüche aus erfolgreichem DIP-Cache prüfen
        if: github.event_name != 'pull_request' && steps.dippositions.outcome == 'success'
        id: original2025
        continue-on-error: true
        run: |
          python wp21_2025_dip_einzelakten.py \
            --vorgang-state .cache/dip21/state.json \
            --position-state .cache/dip21/positionen.json \
            --output .audit/wp21_2025_dip_origins_and_appeals.json \
            --brief .audit/wp21_2025_dip_origins_and_appeals.md
      - name: 2025-DIP-Originalfallakte als nichtzählende amtliche Belege archivieren
        if: github.event_name != 'pull_request' && steps.original2025.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: wp21-2025-dip-origins-and-appeals-${{ github.run_id }}
          path: |
            .audit/wp21_2025_dip_origins_and_appeals.json
            .audit/wp21_2025_dip_origins_and_appeals.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Bei neuem/fehlendem 2025-DIP-Verfahrensschritt warnen statt statistisch korrigieren
        if: github.event_name != 'pull_request' && steps.original2025.outcome == 'failure'
        run: |
          echo '::warning::Historische DIP-2025-Originalfälle oder Einsprüche haben sich geändert: fachliche Quellenprüfung erforderlich, keine Zähleränderung.'
      - name: 18 Einzelakten mit vollständigen amtlichen DIP-Vorgangspositionen abgleichen
        if: github.event_name != 'pull_request' && steps.dipqueue.outcome == 'success'
        id: eighteenDIP
        continue-on-error: true
        run: |
          python wp21_18_dip_verfahrenspositionen.py \
            --vorgang-state .cache/dip21/state.json \
            --position-state .cache/dip21/positionen.json \
            --output .audit/wp21_18_dip_verfahrenspositionen.json \
            --brief .audit/wp21_18_dip_verfahrenspositionen.md
      - name: Quellenscharfe DIP-Verfahrenspositionen als reine Prüfdaten archivieren
        if: github.event_name != 'pull_request' && steps.eighteenDIP.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: wp21-18-dip-quellenverbund-${{ github.run_id }}
          path: |
            .audit/wp21_18_dip_verfahrenspositionen.json
            .audit/wp21_18_dip_verfahrenspositionen.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Originale DIP-Plenar-Fundstellen und Einspruchs-Tenöre separat überprüfen
        if: github.event_name != 'pull_request' && steps.eighteenDIP.outcome == 'success'
        id: eighteenSources
        continue-on-error: true
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('.audit/wp21_18_dip_verfahrenspositionen.json').read_text())
          if (d['original_cases']!=18
                  or d['source_verified_original_grant_positions']!=18
                  or d['source_verified_independent_dip_rejected_appeals']!=4
                  or d['automatically_confirmed_sanctions']!=0
