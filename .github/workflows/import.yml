name: Bundestag Datenimport

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Parser- und Downloadtests
        run: python -m pytest -q tests/

      - name: Alle Protokolle herunterladen und pruefen
        run: python download_protokolle.py --folder protokolle --report download-report.json

      - name: Fundstellen und einzelne Ordnungsrufe extrahieren
        run: |
          python parser.py protokolle \
            --out kandidaten.csv \
            --events-out ordnungsrufe.csv \
            --summary-out sitzungen.csv

      - name: Ereignisregister und Dubletten-Pruefliste erstellen
        run: |
          python ereignis_register.py \
            --candidates kandidaten.csv \
            --people ordnungsrufe.csv \
            --source-folder protokolle \
            --sessions sitzungen.csv \
            --out ereignisse.csv \
            --recipients-out ereignis_empfaenger.csv \
            --duplicates-out dubletten_pruefung.csv \
            --report-out ereignisbericht.json

      - name: Menschliche Pruefentscheidungen anwenden und Pruefvorlagen erstellen
        run: |
          python verifikation.py \
            --events ereignisse.csv \
            --recipients ereignis_empfaenger.csv \
            --relations dubletten_pruefung.csv \
            --sessions sitzungen.csv \
            --decisions pruefentscheidungen \
            --out-folder .

      - name: Unabhaengige Vollstaendigkeitskontrolle der gesamten Protokolltexte
        run: |
          python vollstaendigkeits_audit.py \
            --source-folder protokolle \
            --candidates kandidaten.csv \
            --verified bestaetigte_ordnungsrufe.csv \
            --out-folder .

      - name: Unabhaengiger Abgleich mit DIP-Vorgangsmetadaten (20. Wahlperiode)
        run: |
          python dip_abgleich.py \
            --verified bestaetigte_ordnungsrufe.csv \
            --out-folder .

      - name: DIP-Abgleichausgaben kontrollieren
        run: |
          python - <<'PY_DIP'
          import csv, json
          from pathlib import Path
          for name in ('dip_alle_ordnungsrufbezuege.csv', 'dip_pruefliste.csv'):
              p = Path(name)
              if not p.is_file() or p.stat().st_size > 20_000_000:
                  raise SystemExit('DIP-Ausgabe fehlt/zu gross: ' + name)
              with p.open('r', encoding='utf-8', newline='') as h:
                  if not next(csv.reader(h), None):
                      raise SystemExit('DIP-CSV ohne Kopf: ' + name)
          report = json.loads(Path('dip_bericht.json').read_text(encoding='utf-8'))
          if report.get('dip_vorgaenge_mit_ordnungsruf_im_titel', 0) < 1:
              raise SystemExit('DIP lieferte keinen Ordnungsrufvorgang')
          print('DIP-Ausgaben plausibilisiert, keine Verifikationsentscheidungen verändert.')
          PY_DIP

      - name: Artifact 4 - Unabhaengiger DIP-Abgleich
        uses: actions/upload-artifact@v6
        with:
          name: ordnungsruf-8-dip
          path: |
            dip_alle_ordnungsrufbezuege.csv
            dip_pruefliste.csv
            dip_bericht.json
          if-no-files-found: error
          retention-days: 30

      - name: Auditdateien pruefen und Manifest schreiben
        run: |
          python - <<'PY_AUDIT'
          from pathlib import Path
          import csv
          import hashlib
          import json
          files = (
              'audit_alle_fundstellen.csv',
              'audit_neue_fundstellen.csv',
              'audit_ruecknahmen_einsprueche.csv',
              'audit_amtlicher_abgleich.csv',
              'audit_bericht.json',
          )
          manifest = ['# Name | Bytes | SHA-256']
          for name in files:
              p = Path(name)
              if not p.is_file() or p.is_symlink():
                  raise SystemExit(f'Auditdatei fehlt oder ist ungueltig: {name}')
              data = p.read_bytes()
              if not data or len(data) > 15 * 1024 * 1024:
                  raise SystemExit(f'Auditdatei leer/zu gross: {name}')
              if p.suffix == '.csv':
                  with p.open('r', encoding='utf-8', newline='') as h:
                      rows = csv.reader(h)
                      if not next(rows, None):
                          raise SystemExit(f'CSV Kopfzeile fehlt: {name}')
                      for _ in rows: pass
              else:
                  report = json.loads(data)
                  if report.get('protokolle_volltext_geprueft') != 214:
                      raise SystemExit('Audit nicht auf 214 Protokollen abgeschlossen')
              manifest.append(f'{name} | {len(data)} | {hashlib.sha256(data).hexdigest()}')
          Path('artifact-manifest-audit.txt').write_text(
              '\n'.join(manifest) + '\n', encoding='utf-8')
          print('5 Auditausgaben geprueft.')
          PY_AUDIT

      - name: Artifact 3 von 3 - Unabhaengiger Vollstaendigkeitsaudit
        uses: actions/upload-artifact@v6
        with:
          name: ordnungsruf-7-audit
          path: |
            audit_alle_fundstellen.csv
            audit_neue_fundstellen.csv
            audit_ruecknahmen_einsprueche.csv
            audit_amtlicher_abgleich.csv
            audit_bericht.json
            artifact-manifest-audit.txt
          if-no-files-found: error
          retention-days: 30

      # Nur diese explizit benannten Ergebnisdateien duerfen in die Artifacts.
      # Die Pruefung erkennt ungewoehnliche Dateitypen/fehlende Ausgaben,
      # ersetzt aber KEINEN Virenscan.
      - name: Ergebnisdateien pruefen und Dateilisten erstellen
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import hashlib
          import json
          import stat

          groups = {
              'basis': (
                  'kandidaten.csv',
                  'ordnungsrufe.csv',
                  'sitzungen.csv',
                  'pruefliste.csv',
                  'klaerungsfaelle.csv',
                  'qualitaetsbericht.json',
                  'ereignisse.csv',
                  'ereignis_empfaenger.csv',
                  'dubletten_pruefung.csv',
                  'ereignisbericht.json',
                  'download-report.json',
              ),
              'verifikation': (
                  'pruefvorlage_ereignisse.csv',
                  'pruefvorlage_personen.csv',
                  'pruefvorlage_beziehungen.csv',
                  'bestaetigte_ordnungsrufe.csv',
                  'bestaetigte_statistik.json',
                  'verifikationsbericht.json',
              ),
          }
          maximum_size = 20 * 1024 * 1024  # 20 MiB pro Datei
          for group_name, filenames in groups.items():
              manifest = ['# Name | Bytes | SHA-256']
              for filename in filenames:
                  path = Path(filename)
                  if path.is_symlink() or not path.is_file():
                      raise SystemExit(f'Unerwartete oder fehlende Datei: {filename}')
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit(f'Keine regulaere Datei: {filename}')
                  if path.suffix not in ('.csv', '.json'):
                      raise SystemExit(f'Unerwarteter Dateityp: {filename}')
                  data = path.read_bytes()
                  if not data or len(data) > maximum_size:
                      raise SystemExit(f'Leere oder uebergrosse Datei: {filename}')
                  content = data.decode('utf-8-sig')
                  if path.suffix == '.json':
                      json.loads(content)
                  else:
                      with path.open('r', encoding='utf-8-sig', newline='') as handle:
                          reader = csv.reader(handle)
                          header = next(reader, None)
                          if not header:
                              raise ValueError(f'CSV ohne Kopfzeile: {filename}')
                          for row in reader:
                              pass  # CSV-Syntax lesen; keine fachliche Validierung
                  digest = hashlib.sha256(data).hexdigest()
                  manifest.append(f'{filename} | {len(data)} | {digest}')
                  print(f'{group_name}: {filename} ({len(data)} Bytes; SHA-256 {digest})')
              Path(f'artifact-manifest-{group_name}.txt').write_text(
                  '\n'.join(manifest) + '\n', encoding='utf-8'
              )
          print('Pruefung abgeschlossen: 11 Basisdateien, 6 Verifikationsdateien.')
          PY

      - name: Artifact 1 von 2 - Basisdaten
        uses: actions/upload-artifact@v6
        with:
          name: ordnungsruf-81-basis
          path: |
            kandidaten.csv
            ordnungsrufe.csv
            sitzungen.csv
            pruefliste.csv
            klaerungsfaelle.csv
            qualitaetsbericht.json
            ereignisse.csv
            ereignis_empfaenger.csv
            dubletten_pruefung.csv
            ereignisbericht.json
            download-report.json
            artifact-manifest-basis.txt
          if-no-files-found: error
          retention-days: 30

      - name: Artifact 2 von 2 - Neue Verifikationsdateien
        uses: actions/upload-artifact@v6
        with:
          name: ordnungsruf-81-verifikation
          path: |
            pruefvorlage_ereignisse.csv
            pruefvorlage_personen.csv
            pruefvorlage_beziehungen.csv
            bestaetigte_ordnungsrufe.csv
            bestaetigte_statistik.json
            verifikationsbericht.json
            artifact-manifest-verifikation.txt
          if-no-files-found: error
          retention-days: 30
