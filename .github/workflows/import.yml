
name: Bundestag Datenimport

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Bundestagsprotokoll herunterladen
        run: |
          mkdir -p protokolle
          curl --fail --location --show-error \
            --retry 3 \
            "https://dserver.bundestag.de/btp/20/20214.xml" \
            -o protokolle/20214.xml

      - name: Ordnungsruf-Kandidaten extrahieren
        run: |
          python parser.py protokolle --out kandidaten.csv

      - name: Ergebnisse bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ordnungsruf-kandidaten
          path: kandidaten.csv
          if-no-files-found: error
