name: Bundestag Datenimport

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Parser- und Downloadtests
        run: python -m pytest -q tests/

      - name: Alle Protokolle herunterladen und pruefen
        run: python download_protokolle.py --folder protokolle --report download-report.json

      - name: Fundstellen und einzelne Ordnungsrufe extrahieren
        run: |
          python parser.py protokolle \
            --out kandidaten.csv \
            --events-out ordnungsrufe.csv \
            --summary-out sitzungen.csv

      - name: Ereignisregister und Dubletten-Pruefliste erstellen
        run: |
          python ereignis_register.py \
            --candidates kandidaten.csv \
            --people ordnungsrufe.csv \
            --source-folder protokolle \
            --out ereignisse.csv \
            --recipients-out ereignis_empfaenger.csv \
            --duplicates-out dubletten_pruefung.csv \
            --report-out ereignisbericht.json

      - name: CSV-Dateien und Download-Bericht bereitstellen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ordnungsruf-vollimport
          path: |
            kandidaten.csv
            ordnungsrufe.csv
            sitzungen.csv
            pruefliste.csv
            klaerungsfaelle.csv
            qualitaetsbericht.json
            ereignisse.csv
            ereignis_empfaenger.csv
            dubletten_pruefung.csv
            ereignisbericht.json
            download-report.json
          if-no-files-found: warn
          retention-days: 30
