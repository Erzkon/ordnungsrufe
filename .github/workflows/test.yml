
name: Ordnungsruf Parser Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Browser-Vertrag vor Parser prüfen
        run: |
          node --check docs/verified_contract.js
          node --check docs/app.js
          node --test tests/frontend_contract.test.cjs
          node --check docs/source_health.js
          node --test tests/source_health.test.cjs

      - name: Parser testen
        run: python -m pytest -v
