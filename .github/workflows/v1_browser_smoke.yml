name: V1 actual browser desktop mobile smoke

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/browser_smoke.cjs'
      - '.github/workflows/v1_browser_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    name: Render verified WP20 and partial WP21
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned headless test driver only
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24.20.0
      - name: Verify headless Chrome is available on standard Ubuntu runner
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
          elif command -v chromium >/dev/null; then
            chromium --version
          else
            echo "::error::No Chrome/Chromium available on runner"
            exit 1
          fi
      - name: Render, switch terms, search, test mobile and malicious inputs
        run: node tests/browser_smoke.cjs
      - name: Preserve exact PR render and machine-readable result for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-actual-browser-preview-${{ github.run_id }}
          path: .audit/browser_smoke/
          if-no-files-found: warn
          retention-days: 14
