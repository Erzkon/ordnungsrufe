name: WP21 DIP original document inventory 18 cases

# One-time original official-source schema survey. No legal adjudication.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wp21_18_document_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Protect four confirmed statistics against main
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/main
          for file in daten/wirksame_ordnungsrufe_20wp.csv daten/wirksame_ordnungsrufe_21wp.csv docs/data/ordnungsrufe.json docs/data/ordnungsrufe_21.json; do
            git show "FETCH_HEAD:$file" | cmp -s - "$file" || exit 1
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hash immutable public files before requests
        run: |
          sha256sum daten/wirksame_ordnungsrufe_20wp.csv daten/wirksame_ordnungsrufe_21wp.csv docs/data/ordnungsrufe.json docs/data/ordnungsrufe_21.json > "$RUNNER_TEMP/protected.sha256"
      - name: Check official DIP document association response schemas for all 18 cases
        timeout-minutes: 13
        env:
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,re,time
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          from urllib.error import HTTPError,URLError
          from wp21_hochprioritaet_18 import EXPECTED_KEYS
          from wp21_autopruefung import norm
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  raise ValueError('Do not follow unexpected official redirects')
          pairs=[
              (51,'Markus Frohnmaier',329623),(52,'Martin Hess',330133),
              (53,'Heidi Reichinnek',330237),(57,'Bernd Baumann',330700),
              (61,'Ulrich von Zons',332078),(65,'Luigi Pantisano',332778),
              (65,'Martin Reichardt',332748),(67,'Kathrin Gebel',333090),
              (67,'Kerstin Przygodda',333088),(68,'Paula Piechotta',333149),
              (69,'Fabian Fahl',333185),(69,'Timon Dzienus',333192),
              (71,'Mirze Edis',333814),(71,'Robin Jünger',333809),
              (86,'Cansin Köktürk',336641),(89,'Kai Whittaker',337087),
              (93,'Birgit Bessin',339006),(94,'Cansin Köktürk',339024)]
          if {(s,norm(name)) for s,name,_ in pairs}!=EXPECTED_KEYS:
              raise ValueError('Pinned official original cases unexpectedly changed')
          api='https://search.dip.bundestag.de/api/v1/'
          opener=build_opener(NoRedirect())
          key=os.getenv('DIP_API_KEY') or 'R2BZaee.DjdCyihKZMf8AOjtScubP2EVydegzjmBIQ'
          results=[]
          for session,person,parent in pairs:
              record={'session':session,'person':person,'original_dip_vorgang_id':parent}
              for kind in ('drucksache','plenarprotokoll'):
                  current=None
                  docs=[]
                  seen=set()
                  total=None
                  for page in range(8):
                      params={'f.vorgang':str(parent),'f.wahlperiode':'21'}
                      if current is not None:
                          params['cursor']=current
                      url=api+kind+'?'+urlencode(params)
                      req=Request(url,headers={'Authorization':'ApiKey '+key,
                          'Accept':'application/json',
                          'User-Agent':'OrdnungsrufCounter/0.9 (official source inventory)'})
                      err=None
                      for attempt in range(3):
                          try:
                              with opener.open(req,timeout=30) as resp:
                                  if resp.status!=200: raise ValueError('non-200 DIP document HTTP')
                                  raw=resp.read(2000001)
                              if len(raw)>2000000: raise ValueError('oversize metadata response')
                              data=json.loads(raw.decode('utf-8'))
                              err=None
                              break
                          except (HTTPError,URLError,TimeoutError,OSError) as exc:
                              err=exc
                              if attempt<2: time.sleep(2**attempt)
                      if err: raise err
                      batch=data.get('documents')
                      n=data.get('numFound')
                      cursor=data.get('cursor')
                      if (not isinstance(batch,list) or len(batch)>100
                          or type(n)!=int or n>150 or n<0
                          or not isinstance(cursor,(str,type(None)))):
                          raise ValueError('Unexpected DIP document metadata page '+kind)
                      if total is None: total=n
                      if total!=n: raise ValueError('DIP document pagination changed')
                      for doc in batch:
                          ident=str(doc.get('id',''))
                          if (not re.fullmatch(r'[1-9]\d{0,11}',ident)
                              or ident in seen or doc.get('wahlperiode')!=21):
                              raise ValueError('Malformed official document identity')
                          seen.add(ident)
                          docs.append({
                              'id':ident,'document_number':doc.get('dokumentnummer'),
                              'date':doc.get('datum'),
                              'title':str(doc.get('titel',''))[:250],
                              'document_type':doc.get('typ'),
                              'reference_count':doc.get('vorgangsbezug_anzahl'),
                              'referenced_vorgang_ids':[
                                  x.get('id') for x in doc.get('vorgangsbezug',[])
                                  if isinstance(x,dict)],
                              'fundstelle':doc.get('fundstelle'),
                              'field_names':sorted(doc),
                          })
                      if len(docs)==total: break
                      if not cursor or cursor==current:
                          raise ValueError('Incomplete original DIP document cursor')
                      current=cursor
                  else: raise ValueError('DIP document page cap reached')
                  record[kind]={'reported_total':total,'documents':docs,
                                'parent_filter':str(parent),'complete_pages':True}
              results.append(record)
              print(f"OFFICIAL_DOCS 21/{session:03d} {person}: "
                    f"{record['drucksache']['reported_total']} Drucksachen, "
                    f"{record['plenarprotokoll']['reported_total']} Plenarprotokolle",flush=True)
          outfile=Path('.audit/document_probe')
          outfile.mkdir(parents=True,exist_ok=True)
          snapshot={'status':'read_only_official_dip_document_inventory',
                    'cases':results,'official_dip_cases':len(results),
                    'reported_drucksache_links':sum(r['drucksache']['reported_total'] for r in results),
                    'reported_plenarprotokoll_links':sum(r['plenarprotokoll']['reported_total'] for r in results),
                    'zero_automatic_legal_conclusions':True}
          (outfile/'document_source_inventory.json').write_text(
              json.dumps(snapshot,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('DOCUMENT_INVENTORY_OK '+json.dumps({
              'cases':len(results),
              'drucksachen':snapshot['reported_drucksache_links'],
              'plenarprotokolle':snapshot['reported_plenarprotokoll_links']}))
          PY
      - name: Ensure public statistics remain byte identical
        if: always()
        run: sha256sum --check "$RUNNER_TEMP/protected.sha256"
      - name: Store bounded official document links for manual source assessment
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wp21-18-official-document-inventory-${{ github.run_id }}
          path: .audit/document_probe/document_source_inventory.json
          if-no-files-found: error
          retention-days: 30
