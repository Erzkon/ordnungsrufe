name: Bundestag official minutes catalogue endpoint diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wp21_amtliche_catalogue_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-official-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read only official dataloader endpoint and pagination variants
        shell: bash
        run: |
          python - <<'PY'
          import re
          from html.parser import HTMLParser
          from urllib.request import Request,urlopen
          base='https://www.bundestag.de/ajax/filterlist/de/dokumente/protokolle/amtlicheprotokolle/442098-442098'
          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__();self.href=[];self.attrs=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='a' and 'href' in d:self.href.append((d['href'],d.get('title','')))
                  for k,v in attrs:
                      if 'data-' in k and any(w in k for w in ['offset','limit','total','count','loader','pagination']):
                          self.attrs.append((k,v))
          for suffix in ('','?offset=10&limit=10','?offset=20&limit=10','?limit=100&offset=0'):
              url=base+suffix
              req=Request(url,headers={'User-Agent':'OrdnungsrufCounter/0.7 (github.com/Erzkon/ordnungsrufe)',
                                       'Accept':'text/html, */*'})
              with urlopen(req,timeout=25) as resp:
                  raw=resp.read(2_000_001);mime=resp.headers.get('Content-Type','')
              if len(raw)>2_000_000:raise ValueError('Oversized official index')
              body=raw.decode('utf-8')
              p=Probe();p.feed(body)
              sessions=re.findall(r'\b(?:21/\d{1,3}|\d{1,3}\.\s*Sitzung)',body)
              pdfs=[a for a in p.href if 'amtpr' in a[0].lower() or a[0].lower().endswith('.pdf')]
              print('CATALOG_VARIANT',repr(suffix),'BYTES',len(raw),'MIME',mime,
                    'SESSIONS',sessions[:14],'PDF_LINK_COUNT',len(pdfs),
                    'LINKS',pdfs[:3],'DATA_ATTRS',p.attrs[:6])
              for needle in ('21/','amtpr210','Ergebnisse','pages','offset','data-total'):
                  m=re.search(re.escape(needle),body,re.I)
                  if m:
                      print('CATALOG_CONTEXT',repr(suffix),needle,repr(body[max(0,m.start()-120):m.end()+180]))
          PY
