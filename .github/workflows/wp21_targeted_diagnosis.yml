name: Gezielte DIP-Positivreferenz XML-Kontextdiagnose

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wp21_targeted_diagnosis.yml'
      - 'wp21_source_regression.py'
      - 'wp21_rueckbezug.py'
      - 'tests/test_wp21_rueckbezug.py'
      - 'wp21_fallkontext.py'
      - 'parser.py'
      - 'tests/test_wp21_originalformulierungen.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-wp21-review:
    name: Amtliche Original-XMLs zu bekannten Parser-Lücken prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: XML-Abhängigkeiten bereitstellen
        run: python -m pip install -r requirements.txt
      - name: SHA256 der bestätigten Daten vor Vergleich
        run: |
          sha256sum daten/wirksame_ordnungsrufe_20wp.csv daten/wirksame_ordnungsrufe_21wp.csv \
            docs/data/ordnungsrufe.json docs/data/ordnungsrufe_21.json > "$RUNNER_TEMP/protected.sha256"
      - name: Kuratierte DIP-Sitzungen mit amtlichem XML und Sprecher-Kontext untersuchen
        run: |
          python wp21_fallkontext.py --output .audit/targeted_context.json
      - name: Zusätzliche offizielle Original-XMLs für Positiv- und Negativproben laden
        run: |
          python - <<'PY'
          from pathlib import Path
          from wp21_scan import fetch
          for number in (15,22,23,25,27,43,50,69,74,75,82):
              data=fetch(number,Path('.audit/targeted_xml'))
              if data is None:
                  raise RuntimeError(f'Amtliches Original 21/{number:03d} nicht verfügbar')
          PY
      - name: Noch ungeklärte XML-Sprecherkette 52, 65, 67 isoliert nachvollziehen
        run: |
          python - <<'PY'
          from pathlib import Path
          from wp21_scan import safe_parse
          from parser import iter_session_text,issuer_context
          for n,anchors in ((52,(3749,)),(65,(2044,2046)),(67,(3079,))):
              root=safe_parse(Path(f'.audit/targeted_xml/21{n:03d}.xml').read_bytes(),n)
              ps=list(iter_session_text(root))
              print('TRACE_START',n,flush=True)
              selected={i for i,(el,text) in enumerate(ps)
                        if any(abs(int(el.sourceline)-a)<9 for a in anchors)}
              for idx in sorted(selected):
                  el,spoken=ps[idx]
                  source=el.getparent()
                  near=el.xpath('./preceding-sibling::p[@klasse="redner"][1]//redner')
                  who=(near[0].get('id') or '') if len(near)==1 else '-'
                  tagname=('-' if len(near)!=1 else ' '.join(near[0].xpath('.//vorname/text()')+
                                                              near[0].xpath('.//nachname/text()')))
                  issuer,kind=issuer_context(el)
                  print('TRACE',n,el.sourceline,kind,issuer[:52],
                        'SPEAKER',who,tagname,
                        'TXT',' '.join(spoken.split())[:280],flush=True)
              for keyword in ({52:('Inkompetenz','Antifa'),65:('Reichardt',),
                               67:('pathologischen Männerhass','Gebel')}[n]):
                  hit=[(el.sourceline,text[:220]) for el,text in ps
                       if any(0<=int(el.sourceline)-a<65 for a in anchors)
                       and keyword.casefold() in text.casefold()]
                  print('TERM',n,keyword,hit[:10],flush=True)
          PY
      - name: Echte XML-Gegenbeispiele gegen Parser-Verwechslungen prüfen
        run: python wp21_source_regression.py --folder .audit/targeted_xml
      - name: Bytes der bestätigten Zähler unverändert
        if: always()
        run: sha256sum --check "$RUNNER_TEMP/protected.sha256"
      - name: Begrenzte Prüfkontexte als Artefakt bereitstellen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wp21-targeted-context-${{ github.run_id }}
          path: .audit/targeted_context.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Nicht bestätigte Personen-Kontexte ausgeben
        if: success()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          doc=json.loads(Path('.audit/targeted_context.json').read_text(encoding='utf-8'))
          rows=['## Amtlicher XML-Quellenkontext (ohne Auto-Freigabe)',
            f"- XML-Sitzungen: {doc['sessions_loaded']}",
            f"- Personen/Sitzung-Zielreferenzen: {doc['person_session_targets']}",
            '- Belegstellen sind Such- und Prüfhinweise, keine zugeordneten Sanktionen.',
            '- Bestätigte Statistikdateien blieben bytegleich.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as stream:
            stream.write('\n'.join(rows)+'\n')
          print('\n'.join(rows))
          PY
