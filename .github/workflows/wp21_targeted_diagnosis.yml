name: Gezielte DIP-Positivreferenz XML-Kontextdiagnose

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wp21_targeted_diagnosis.yml'
      - 'wp21_source_regression.py'
      - 'wp21_rueckbezug.py'
      - 'wp21_quellen_adressaten.py'
      - 'tests/test_wp21_quellen_adressaten.py'
      - 'tests/test_wp21_rueckbezug.py'
      - 'tests/test_wp21_remaining_identities.py'
      - 'tests/test_wp21_mehrfach_40.py'
      - 'wp21_mehrfach_40.py'
      - 'tests/test_wp21_mehrfach_dossier.py'
      - 'wp21_fallkontext.py'
      - 'parser.py'
      - 'tests/test_wp21_originalformulierungen.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-wp21-review:
    name: Amtliche Original-XMLs zu bekannten Parser-Lücken prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: XML-Abhängigkeiten bereitstellen
        run: python -m pip install -r requirements.txt
      - name: SHA256 der bestätigten Daten vor Vergleich
        run: |
          sha256sum daten/wirksame_ordnungsrufe_20wp.csv daten/wirksame_ordnungsrufe_21wp.csv \
            docs/data/ordnungsrufe.json docs/data/ordnungsrufe_21.json > "$RUNNER_TEMP/protected.sha256"
      - name: Kuratierte DIP-Sitzungen mit amtlichem XML und Sprecher-Kontext untersuchen
        run: |
          python wp21_fallkontext.py --output .audit/targeted_context.json
      - name: Zusätzliche offizielle Original-XMLs für Positiv- und Negativproben laden
        run: |
          python - <<'PY'
          from pathlib import Path
          from wp21_scan import fetch
          for number in (14,15,22,23,25,26,27,37,39,40,43,49,50,51,65,69,74,75,82):
              data=fetch(number,Path('.audit/targeted_xml'))
              if data is None:
                  raise RuntimeError(f'Amtliches Original 21/{number:03d} nicht verfügbar')
          PY
      - name: 21/040 namentlichen Janich-Zwischenruf im Original-XML strukturell prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          from wp21_scan import safe_parse
          root=safe_parse(Path('.audit/targeted_xml/21040.xml').read_bytes(),40)
          for node in root.iter():
              if not node.sourceline or not 8698<=node.sourceline<=8723:
                  continue
              txt=' '.join(''.join(node.itertext()).split())
              if (node.tag in ('p','kommentar','zwischenruf','name','rede','redner')
                      and ('Janich' in txt or
                           node.sourceline in (8715,8717,8719))):
                  print('JANICH_XML',node.tag,node.sourceline,
                        'class=',node.get('klasse'),
                        'parent=',node.getparent().tag if node.getparent() is not None else '',
                        'xml=',etree.tostring(node,encoding='unicode')[:1850],
                        flush=True)
          PY
      - name: Noch offene XML-Adressaten 26 43 49 51 65 mit Zwischenrufen prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          from wp21_scan import safe_parse
          from parser import normal,issuer_context,iter_session_text,speaker_index,events
          for number,targets in ((26,(3436,)),(43,(2405,3497)),
                                 (49,(3280,)),(51,(3981,)),(65,(2044,))):
              root=safe_parse(Path(f'.audit/targeted_xml/21{number:03d}.xml').read_bytes(),number)
              paras=list(iter_session_text(root))
              index=speaker_index([root])
              found={int(x['line']):x for x in events(
                  Path(f'21{number:03d}.xml'),root=root,index=index)}
              for line in targets:
                  print('CASE_START',number,line,flush=True)
                  grant=next(p for p,t in paras if int(p.sourceline)==line)
                  for p,t in paras:
                      n=int(p.sourceline)
                      if not line-15<=n<=line+8:continue
                      issuer,kind=issuer_context(p)
                      print('CASE_P',number,n,kind,issuer[:60],repr(t[:320]),
                            'hint=',found.get(n,{}).get('person'),flush=True)
                  rede=grant.getparent()
                  siblings=list(rede)
                  i=siblings.index(grant)
                  for x in siblings[max(0,i-17):min(len(siblings),i+6)]:
                      if x.tag in ('kommentar','name') or x.get('klasse')=='redner':
                          txt=normal(''.join(x.itertext()))
                          print('CASE_NODE',number,x.sourceline,x.tag,
                                x.get('klasse'),repr(txt[:300]),flush=True)
          PY
      - name: Echte XML-Gegenbeispiele gegen Parser-Verwechslungen prüfen
        run: python wp21_source_regression.py --folder .audit/targeted_xml
      - name: Erst-/Zweiterteilungspaare WP21/040 gesondert pruefen
        run: python wp21_mehrfach_40.py --cache .audit/targeted_xml --output .audit/wp21_040_pairs.json
      - name: Bytes der bestätigten Zähler unverändert
        if: always()
        run: sha256sum --check "$RUNNER_TEMP/protected.sha256"
      - name: Begrenzte Prüfkontexte als Artefakt bereitstellen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wp21-targeted-context-${{ github.run_id }}
          path: |
            .audit/targeted_context.json
            .audit/wp21_040_pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Nicht bestätigte Personen-Kontexte ausgeben
        if: success()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          doc=json.loads(Path('.audit/targeted_context.json').read_text(encoding='utf-8'))
          rows=['## Amtlicher XML-Quellenkontext (ohne Auto-Freigabe)',
            f"- XML-Sitzungen: {doc['sessions_loaded']}",
            f"- Personen/Sitzung-Zielreferenzen: {doc['person_session_targets']}",
            '- Belegstellen sind Such- und Prüfhinweise, keine zugeordneten Sanktionen.',
            '- Bestätigte Statistikdateien blieben bytegleich.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as stream:
            stream.write('\n'.join(rows)+'\n')
          print('\n'.join(rows))
          PY
